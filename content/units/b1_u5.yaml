  character: rosa
  scenario_es: "Alguien te da un horario. Escúchalo, repítelo y di si entendiste."
  scenario_en: "Someone gives you a schedule. Listen, repeat it back, and say if you understood."
  target_chunks: [c_0107, c_0109, c_0110, c_0111, c_0127, c_0122]
  script:
    - speaker: ai
      en: "Hello, {name}. This is your week."
      es: "Hola, {name}. Esta es tu semana."
