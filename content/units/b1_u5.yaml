# Block 1, Unit 5 -- time, days, and the first thing Miguel gets wrong on
# purpose.
#
# The beat (content/STORY.md): Rosa gives him his hours. He reads them back and
# gets one wrong. This is where Block 1 stops being about meeting people and
# starts being about the thing he came here to do.
#
# Design notes for whoever edits this next:
#   * Rosa is the authority figure and a nervous beginner expects authority to
#     be a threat. She is the proof it is not. When Miguel reads his hours back
#     wrong she corrects the FACT and not his English, and she never says sorry
#     for him or slows down theatrically. That scene is doing more work than
#     the vocabulary is.
#   * Two grouped chunks carry the seven days, for the same reason four carried
#     the numbers in b1_u2: seven single-word chunks would be vocabulary, and
#     an example may introduce at most two new words.
#   * `yesterday` was planned for this unit and cut. There is no way to use it
#     without a past tense and the past tense is Block 4 -- see the note in
#     content/vocab-schedule.yaml.

