missions:
  - id: m_0009
    title_es: "Pregunta la hora"
    instructions_es: >-
      Pregúntale la hora a alguien en inglés: "What time is it?". Aunque traigas
      el teléfono en la mano. Lo que se practica es abrir la boca, no saber la
      hora.
    prep_chunk_ids: [c_0103]
    difficulty: 2
    alternate_es: >-
      Dilo en voz alta cada vez que mires la hora hoy. Tres veces y ya no lo
      piensas.

  - id: m_0010
    title_es: "Di tu horario"
    instructions_es: >-
      Dile a alguien en inglés qué días y a qué hora trabajas o estudias:
      "I work from Monday to Friday. I start at eight o'clock." Si te
      equivocas en una hora, corrígela y sigue. Eso también es hablar.
    prep_chunk_ids: [c_0109, c_0110]
    difficulty: 3
    alternate_es: >-
      Escríbelo primero, léelo en voz alta, y luego dilo sin leer. Que salga
      completo una vez es la meta.
