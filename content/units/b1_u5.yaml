scenes:
  # One day: Carlos brings the work, Rosa gives the hours, Miguel gets one
  # wrong and is corrected without being made small, and then he tells two
  # people his schedule because it is his.

  - id: s_0025
    title_es: "Carlos trae el trabajo"
    character: carlos
    duration_target_s: 46
    transcript: |
      CARLOS: Miguel! Good morning.
      MIGUEL: Good morning, Carlos. How are you?
      CARLOS: I am fine. Miguel, do you need work?
      MIGUEL: Yes. I need to work.
      CARLOS: Okay. I work with Rosa. Rosa is here every day.
      MIGUEL: Rosa?
      CARLOS: Yes. She is my friend. When do you start?
      MIGUEL: Excuse me? I do not understand.
      CARLOS: What days do you work? Monday? Tuesday?
      MIGUEL: I do not work. I need to work.
      CARLOS: Okay! Come with me. Rosa is here.
      MIGUEL: Now?
      CARLOS: Now. It is early. It is eight o'clock.
    questions:
      - q_es: "¿Qué le ofrece Carlos a Miguel?"
        options_es:
          - "Llevarlo a ver a Rosa por trabajo"
          - "Su número de teléfono"
          - "Acompañarlo al café"
        q_en: "What does Carlos offer Miguel?"
        options_en:
          - "To take him to see Rosa about work"
          - "His phone number"
          - "To go with him to the café"
        answer: 0
      - q_es: "¿Por qué Carlos dice que es temprano?"
        options_es:
          - "Porque Miguel llegó tarde"
          - "Porque hay tiempo para ir ahora"
          - "Porque Rosa no está"
        q_en: "Why does Carlos say it is early?"
        options_en:
          - "Miguel arrived late"
          - "There is time to go now"
          - "Rosa is not there"
        answer: 1
      - q_es: "¿Miguel entiende la pregunta de Carlos a la primera?"
        options_es:
          - "Sí, contesta enseguida"
          - "No, y se queda callado"
          - "No, y dice que no entiende"
        q_en: "Does Miguel understand Carlos's question first time?"
        options_en:
          - "Yes, he answers right away"
          - "No, and he stays quiet"
          - "No, and he says he does not understand"
        answer: 2

  - id: s_0026
    title_es: "Rosa"
    character: rosa
    duration_target_s: 46
    transcript: |
      CARLOS: Rosa, this is Miguel. Miguel, this is Rosa.
      ROSA: Hello, Miguel. Nice to meet you.
      MIGUEL: Nice to meet you, Rosa.
      ROSA: Miguel, do you need work?
      MIGUEL: Yes. I need to work.
      ROSA: Okay. What days do you work?
      MIGUEL: Every day. I work every day.
      ROSA: Every day! No, Miguel. Not Sunday.
      MIGUEL: Not Sunday?
      ROSA: You do not work on Sunday. From Monday to Saturday.
      MIGUEL: From Monday to Saturday. Okay.
      ROSA: And Sunday is your day.
      MIGUEL: Sunday is my day. Thank you, Rosa.
    questions:
      - q_es: "¿Qué corrige Rosa?"
        options_es:
          - "El inglés de Miguel"
          - "Cuántos días va a trabajar"
          - "Cómo se llama"
        q_en: "What does Rosa correct?"
        options_en:
          - "Miguel's English"
          - "How many days he will work"
          - "His name"
        answer: 1
      - q_es: "¿Miguel quería trabajar más o menos días de los que le dan?"
        options_es:
          - "Más"
          - "Menos"
          - "Los mismos"
        q_en: "Did Miguel want to work more or fewer days than he gets?"
        options_en:
          - "More"
          - "Fewer"
          - "The same"
        answer: 0
      - q_es: "¿Cómo le habla Rosa a Miguel?"
        options_es:
          - "Con enojo"
          - "Muy despacio, como a un niño"
          - "Directa y sin problema"
        q_en: "How does Rosa talk to Miguel?"
        options_en:
          - "Angrily"
          - "Very slowly, like to a child"
          - "Directly, no problem"
        answer: 2

  - id: s_0027
    title_es: "El horario"
    character: rosa
    duration_target_s: 48
    transcript: |
      ROSA: Miguel, this is your week.
      MIGUEL: Okay.
      ROSA: You start at eight o'clock in the morning.
      MIGUEL: I start at eight o'clock.
      ROSA: Yes. And you finish at four o'clock.
      MIGUEL: I finish at four o'clock in the afternoon.
      ROSA: Good. From Monday to Friday.
      MIGUEL: From Monday to Friday. And Saturday?
      ROSA: On Saturday you start at nine o'clock.
      MIGUEL: One moment, I do not understand.
      ROSA: Saturday is not eight. Saturday is nine o'clock.
      MIGUEL: Saturday is nine o'clock. Okay.
      ROSA: And you finish at one o'clock.
      MIGUEL: At one o'clock. Thank you, Rosa.
    questions:
      - q_es: "¿Qué tiene de distinto el sábado?"
        options_es:
          - "Empieza más tarde y termina antes"
          - "No trabaja"
          - "Empieza más temprano"
        q_en: "What is different about Saturday?"
        options_en:
          - "Starts later and finishes earlier"
          - "No work"
          - "Starts earlier"
        answer: 0
      - q_es: "¿Qué hace Miguel cuando se pierde con el sábado?"
        options_es:
          - "Dice que sí igual"
          - "Dice que no entiende"
          - "Se va"
        q_en: "What does Miguel do when he gets lost on Saturday?"
        options_en:
          - "Says yes anyway"
          - "Says he does not understand"
          - "Leaves"
        answer: 1
      - q_es: "¿A qué hora termina de lunes a viernes?"
        options_es:
          - "A la una"
          - "A las nueve"
          - "A las cuatro"
        q_en: "What time does he finish Monday to Friday?"
        options_en:
          - "At one"
          - "At nine"
          - "At four"
        answer: 2

  - id: s_0028
    title_es: "Miguel repite el horario"
    character: rosa
    duration_target_s: 48
    transcript: |
      ROSA: Miguel, say the week.
      MIGUEL: From Monday to Friday. I start at eight o'clock.
      ROSA: Yes.
      MIGUEL: And I finish at four o'clock.
      ROSA: Yes. And Saturday?
      MIGUEL: On Saturday I start at eight o'clock.
      ROSA: No. Not eight. On Saturday you start at nine o'clock.
      MIGUEL: Nine o'clock. Not eight.
      ROSA: Nine. Say it, please.
      MIGUEL: On Saturday I start at nine o'clock, and I finish at one.
      ROSA: Good, Miguel. That is it.
      MIGUEL: I understand. Thank you, Rosa.
      ROSA: See you tomorrow. Tomorrow is Monday.
      MIGUEL: Tomorrow is Monday. See you tomorrow.
    questions:
      - q_es: "¿En qué se equivoca Miguel?"
        options_es:
          - "En la hora del sábado"
          - "En los días que trabaja"
          - "En la hora de salida"
        q_en: "What does Miguel get wrong?"
        options_en:
          - "The Saturday time"
          - "The days he works"
          - "The finishing time"
        answer: 0
      - q_es: "¿Qué hace Rosa cuando Miguel se equivoca?"
        options_es:
          - "Se lo pasa por alto"
          - "Se lo corrige y le pide que lo repita"
          - "Le dice que su inglés está mal"
        q_en: "What does Rosa do when Miguel gets it wrong?"
        options_en:
          - "Lets it go"
          - "Corrects it and asks him to repeat"
          - "Says his English is bad"
        answer: 1
      - q_es: "¿Qué día empieza a trabajar?"
        options_es:
          - "El sábado"
          - "El domingo"
          - "El lunes"
        q_en: "What day does he start work?"
        options_en:
          - "Saturday"
          - "Sunday"
          - "Monday"
        answer: 2

  - id: s_0029
    title_es: "Miguel le cuenta a Ana"
    character: ana
    duration_target_s: 46
    transcript: |
      ANA: Miguel! Good evening. How are you?
      MIGUEL: Ana! I am fine. I have work.
      ANA: You have work! Where do you work?
      MIGUEL: I work with Carlos and Rosa.
      ANA: When do you work?
      MIGUEL: From Monday to Friday. I start at eight o'clock.
      ANA: Eight o'clock! That is early.
      MIGUEL: It is early. And I finish at four o'clock.
      ANA: And Saturday?
      MIGUEL: On Saturday I start at nine o'clock, until one.
      ANA: And Sunday?
      MIGUEL: I do not work on Sunday. Sunday is my day.
      ANA: Sunday is your day! Good, Miguel.
      MIGUEL: Tomorrow is Monday. I start tomorrow.
    questions:
      - q_es: "¿Cómo cuenta Miguel su horario aquí?"
        options_es:
          - "Se equivoca con el sábado otra vez"
          - "Le pide a Ana que lo ayude"
          - "Lo dice entero y bien"
        q_en: "How does Miguel tell his schedule here?"
        options_en:
          - "Gets Saturday wrong again"
          - "Asks Ana for help"
          - "Says it all, and right"
        answer: 2
      - q_es: "¿Qué le parece a Ana la hora de entrada?"
        options_es:
          - "Que es temprano"
          - "Que es tarde"
          - "No dice nada"
        q_en: "What does Ana think of the start time?"
        options_en:
          - "That it is early"
          - "That it is late"
          - "She says nothing"
        answer: 0
      - q_es: "¿Qué es el domingo para Miguel?"
        options_es:
          - "El día que empieza"
          - "Su día libre"
          - "Un día de trabajo corto"
        q_en: "What is Sunday for Miguel?"
        options_en:
          - "The day he starts"
          - "His day off"
          - "A short work day"
        answer: 1

  - id: s_0030
    title_es: "En el café, en la noche"
    character: maria
    duration_target_s: 46
    transcript: |
      MARIA: Miguel! Good evening.
      MIGUEL: Good evening, Maria.
      MARIA: What time is it?
      MIGUEL: One moment. It is eight o'clock.
      MARIA: Eight o'clock in the evening! It is late.
      MIGUEL: It is late. And I start at eight tomorrow.
      MARIA: Tomorrow! What days do you work?
      MIGUEL: From Monday to Friday, and Saturday.
      MARIA: Every day! And Sunday?
      MIGUEL: I do not work on Sunday.
      MARIA: The café is open on Sunday. Come on Sunday, Miguel.
      MIGUEL: On Sunday. Okay!
      MARIA: Good night. See you tomorrow.
      MIGUEL: Good night, Maria. See you on Sunday.
    questions:
      - q_es: "¿Por qué Maria le dice que vaya el domingo?"
        options_es:
          - "Porque el café cierra el resto de la semana"
          - "Porque es el único día que Miguel no trabaja"
          - "Porque el domingo hay más gente"
        q_en: "Why does Maria tell him to come on Sunday?"
        options_en:
          - "The café is closed the rest of the week"
          - "It is the only day Miguel does not work"
          - "Sunday has more people"
        answer: 1
      - q_es: "¿Qué hace Miguel antes de decir la hora?"
        options_es:
          - "Pide un momento"
          - "Pregunta a otra persona"
          - "Dice que no sabe"
        q_en: "What does Miguel do before saying the time?"
        options_en:
          - "Asks for a moment"
          - "Asks someone else"
          - "Says he does not know"
        answer: 0
      - q_es: "Maria se despide hasta mañana y Miguel hasta el domingo. ¿Por qué?"
        options_es:
          - "Porque no entendió a Maria"
          - "Porque mañana trabaja y el domingo no"
          - "Porque el café cierra mañana"
        q_en: "Maria says \"see you tomorrow\" and Miguel says \"see you on Sunday\". Why?"
        options_en:
          - "He did not understand Maria"
          - "He works tomorrow and not on Sunday"
          - "The café is closed tomorrow"
        answer: 1

speaking_task:
