# The unit the frame type was built for. Almost every filler is a Latinate
# cognate the readability scorer credits for free, so one authored pattern buys
# a dozen sayable sentences -- which is the entire argument for the type.
frames:
  - id: f_0011
    pattern: "I would like {NP}, please."
    es_pattern: "Quisiera {NP}, por favor."
    slot: NP
    literal_fillers:
      ["a coffee", "a tea", "water", "some bread", "a sandwich", "a salad", "some fruit", "some soup"]
    filler_images:
      "a coffee": /images/coffee.svg
      "a tea": /images/tea.svg
      "water": /images/water.svg
      "some bread": /images/bread.svg
      "a sandwich": /images/sandwich.svg
      "a salad": /images/salad.svg
      "some fruit": /images/fruit.svg
      "some soup": /images/soup.svg
    cefr: A0
    tags: [ordering]

  - id: f_0012
    pattern: "Do you have {NP}?"
    es_pattern: "¿Tienen {NP}?"
    slot: NP
    literal_fillers:
      ["food", "water", "milk", "bread", "fruit", "chocolate", "coffee"]
    filler_images:
      "food": /images/food.svg
      "water": /images/water.svg
      "milk": /images/milk.svg
      "bread": /images/bread.svg
      "fruit": /images/fruit.svg
      "chocolate": /images/chocolate.svg
      "coffee": /images/coffee.svg
    cefr: A0
    tags: [question, ordering]

scenes:
  # One morning, and Miguel does it alone. Carlos offers to come and is turned
  # down in s_0031; Maria waits in s_0033 instead of rescuing him; and by
  # s_0036 he is the one asking someone else what they want.

  - id: s_0031
    title_es: "Voy solo"
    character: carlos
    duration_target_s: 50
    transcript: |
      CARLOS: Good morning, Miguel. Are you okay?
      MIGUEL: Good morning, Carlos. I am hungry.
      CARLOS: You are hungry! The café is open. Come with me.
      MIGUEL: No, thank you. I go.
      CARLOS: You go? Without me?
      MIGUEL: Yes. I want to eat, and I go.
      CARLOS: What do you want to eat?
      MIGUEL: Some bread. And a coffee. I am hungry.
      CARLOS: A coffee! The coffee is good there.
      MIGUEL: It is good. I want a small coffee with milk.
      CARLOS: Okay! Do you want help?
      MIGUEL: No, thank you. I have it.
      CARLOS: Okay, Miguel. Maria is there every morning.
      MIGUEL: Maria is there. Okay.
      CARLOS: See you later!
      MIGUEL: See you later, Carlos.
    questions:
      - q_es: "¿Qué le ofrece Carlos y Miguel rechaza?"
        options_es:
          - "Acompañarlo al café"
          - "Comida de su casa"
          - "Llevarlo en autobús"
        q_en: "What does Carlos offer that Miguel turns down?"
        options_en:
          - "To go with him to the café"
          - "Food from his house"
          - "A bus ride"
        answer: 0
      - q_es: "¿Por qué Miguel quiere ir al café?"
        options_es:
          - "Para ver a Maria"
          - "Porque tiene hambre"
          - "Porque no trabaja hoy"
        q_en: "Why does Miguel want to go to the café?"
        options_en:
          - "To see Maria"
          - "He is hungry"
          - "He is not working today"
        answer: 1
      - q_es: "¿Cómo dice Miguel que no necesita ayuda?"
        options_es:
          - "No contesta"
          - "Dice que está ocupado"
          - "Dice que no, gracias, dos veces"
        q_en: "How does Miguel say he does not need help?"
        options_en:
          - "He does not answer"
          - "He says he is busy"
          - "He says \"no, thank you\" twice"
        answer: 2

  - id: s_0032
    title_es: "Quisiera un café"
    character: maria
    duration_target_s: 50
    transcript: |
      MARIA: Good morning! How are you?
      MIGUEL: Good morning, Maria. I am fine, thank you.
      MARIA: What do you want?
      MIGUEL: I would like a coffee, please.
      MARIA: A coffee. Big or small?
      MIGUEL: Give me a moment, please.
      MARIA: Take your time, Miguel.
      MIGUEL: A small coffee, please.
      MARIA: A small coffee. With milk?
      MIGUEL: With milk, please.
      MARIA: With milk. And do you want food? Do you want some bread?
      MIGUEL: Yes, please. Some bread, please.
      MARIA: Some bread and a small coffee with milk.
      MIGUEL: Yes! That is it.
      MARIA: Do you want it hot?
      MIGUEL: Yes, hot, please. I do not like it cold.
      MARIA: Hot. Okay, one moment.
      MIGUEL: Thank you, Maria.
    questions:
      - q_es: "¿Qué hace Maria cuando Miguel necesita pensar?"
        options_es:
          - "Espera"
          - "Le contesta ella"
          - "Le habla en español"
        q_en: "What does Maria do when Miguel needs to think?"
        options_en:
          - "Waits"
          - "Answers for him"
          - "Speaks to him in Spanish"
        answer: 0
      - q_es: "¿Qué pide Miguel exactamente?"
        options_es:
          - "Un café grande sin leche"
          - "Un café pequeño con leche y pan"
          - "Un té con leche"
        q_en: "What exactly does Miguel order?"
        options_en:
          - "A big coffee without milk"
          - "A small coffee with milk and bread"
          - "A tea with milk"
        answer: 1
      - q_es: "¿Quién decide el tamaño del café?"
        options_es:
          - "Maria"
          - "Nadie, viene de un tamaño"
          - "Miguel"
        q_en: "Who decides the size of the coffee?"
        options_en:
          - "Maria"
          - "Nobody, it comes in one size"
          - "Miguel"
        answer: 2

  - id: s_0033
    title_es: "¿Cuánto es?"
    character: maria
    duration_target_s: 50
    transcript: |
      MARIA: Here it is, Miguel. Take it, please.
      MIGUEL: Thank you. How much is it?
      MARIA: It is four.
      MIGUEL: Four. One moment, please.
      MARIA: Take your time.
      MIGUEL: One, two, three, four. Here it is.
      MARIA: Thank you, Miguel!
      MIGUEL: Is the coffee hot?
      MARIA: Yes, it is hot. It is not cold.
      MIGUEL: Good. I like it hot.
      MARIA: Do you like the bread?
      MIGUEL: I like it. It is good.
      MARIA: Do you want a little more?
      MIGUEL: No, thank you. It is good.
      MIGUEL: Maria, do you have fruit?
      MARIA: Today, no. Tomorrow.
      MIGUEL: Tomorrow. Okay!
      MARIA: Good! Come every morning, Miguel.
    questions:
      - q_es: "¿Qué hace Miguel para pagar?"
        options_es:
          - "Le da el teléfono a Maria"
          - "Cuenta el dinero en voz alta"
          - "Le pide ayuda a Maria"
        q_en: "What does Miguel do to pay?"
        options_en:
          - "Gives Maria his phone"
          - "Counts the money out loud"
          - "Asks Maria for help"
        answer: 1
      - q_es: "¿Cómo le gusta el café a Miguel?"
        options_es:
          - "Caliente"
          - "Frío"
          - "No dice"
        q_en: "How does Miguel like his coffee?"
        options_en:
          - "Hot"
          - "Cold"
          - "He does not say"
        answer: 0
      - q_es: "¿Qué le pregunta Maria al final?"
        options_es:
          - "Si quiere más café"
          - "Cuánto tiene"
          - "Si le gusta el pan"
        q_en: "What does Maria ask at the end?"
        options_en:
          - "If he wants more coffee"
          - "How much he has"
          - "If he likes the bread"
        answer: 2

  - id: s_0034
    title_es: "No me gusta"
    character: tom
    duration_target_s: 50
    transcript: |
      TOM: Miguel! Good morning. Are you here every morning?
      MIGUEL: Good morning, Tom. Yes, every morning.
      TOM: What do you have?
      MIGUEL: A small coffee with milk, and some bread.
      TOM: Do you like it?
      MIGUEL: I like it. It is hot, and it is good.
      TOM: I want a tea. I do not like coffee.
      MIGUEL: You do not like coffee?
      TOM: No. I do not like it. I like tea.
      MIGUEL: Maria, a tea for Tom, please.
      MARIA: A tea. With milk?
      MIGUEL: Tom, do you want milk in the tea?
      TOM: No, thank you. Without milk.
      MIGUEL: Without milk, please, Maria.
      TOM: Thank you, Miguel!
      MIGUEL: It is for you. Take it, please.
    questions:
      - q_es: "¿Qué hace Miguel por Tom?"
        options_es:
          - "Le pide un té"
          - "Le da su café"
          - "Le presta dinero"
        q_en: "What does Miguel do for Tom?"
        options_en:
          - "Orders him a tea"
          - "Gives him his coffee"
          - "Lends him money"
        answer: 0
      - q_es: "¿Por qué Tom no pide café?"
        options_es:
          - "Porque está frío"
          - "Porque no le gusta"
          - "Porque es caro"
        q_en: "Why does Tom not order coffee?"
        options_en:
          - "It is cold"
          - "He does not like it"
          - "It is expensive"
        answer: 1
      - q_es: "¿Qué hace Miguel que no había hecho nunca en el café?"
        options_es:
          - "Saludar a Maria"
          - "Pedir algo para él"
          - "Pedir algo para otra persona"
        q_en: "What does Miguel do that he had never done in the café?"
        options_en:
          - "Greet Maria"
          - "Order something for himself"
          - "Order something for someone else"
        answer: 2

  - id: s_0035
    title_es: "Ana tiene sed"
    character: ana
    duration_target_s: 46
    transcript: |
      ANA: Miguel! Good morning. Are you okay?
      MIGUEL: Good morning, Ana. I am fine. Do you want a coffee?
      ANA: No, thank you. I am thirsty. I want water.
      MIGUEL: You are thirsty. Okay.
      MIGUEL: Maria, do you have water?
      MARIA: Yes! Here it is. It is cold.
      MIGUEL: Ana, here it is. It is cold water.
      ANA: Thank you, Miguel!
      MIGUEL: Do you want food? Do you want some bread?
      ANA: A little, please. I am not hungry.
      MIGUEL: Some bread for Ana, please.
      ANA: Thank you. You are here every morning!
      MIGUEL: Every morning. It is my café.
    questions:
      - q_es: "¿Qué necesita Ana?"
        options_es:
          - "Comida, tiene hambre"
          - "Un café caliente"
          - "Agua, tiene sed"
        q_en: "What does Ana need?"
        options_en:
          - "Food, she is hungry"
          - "A hot coffee"
          - "Water, she is thirsty"
        answer: 2
      - q_es: "¿Quién habla con Maria por Ana?"
        options_es:
          - "Miguel"
          - "Ana misma"
          - "Nadie"
        q_en: "Who talks to Maria for Ana?"
        options_en:
          - "Miguel"
          - "Ana herself"
          - "Nobody"
        answer: 0
      - q_es: "¿Qué quiere decir Miguel con \"es mi café\"?"
        options_es:
          - "Que el café es de su propiedad"
          - "Que ya es un lugar suyo"
          - "Que le pagó a Maria"
        q_en: "What does Miguel mean by \"it is my café\"?"
        options_en:
          - "That he owns the café"
