      es: "Gracias. ¿Cuánto es?"

missions:
  - id: m_0011
    title_es: "Pide algo en inglés"
    instructions_es: >-
      Pide algo en un mostrador en inglés: "I would like a coffee, please".
      Si te preguntan algo y no entiendes, di "Give me a moment, please".
      Nadie se va a molestar. Es la frase que te da tiempo.
    prep_chunk_ids: [c_0128, c_0149]
    difficulty: 3
    alternate_es: >-
      Dilo en voz alta antes de entrar, tres veces, y luego pídelo en español.
      La próxima vez ya lo tienes en la boca.

  - id: m_0012
    title_es: "Pide algo para otra persona"
    instructions_es: >-
      Pregúntale a alguien qué quiere y pídelo tú en inglés por esa persona.
      Es la última misión del bloque y la más difícil: hablas por otro.
    prep_chunk_ids: [c_0132, c_0151]
