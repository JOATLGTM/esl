# Block 1, Unit 6 -- asking for what you want, alone.
#
# The beat (content/STORY.md): Miguel orders at Maria's counter by himself and
# gets what he asked for. The block ends here on purpose -- it is the first
# thing he does entirely alone, in the place the learner has watched him be
# silent in since unit 1.
#
# Design notes for whoever edits this next:
#   * This is the unit the `frame` type was built for. `I would like {NP},
#     please.` takes anything on a counter, and almost everything on a counter
#     is a Latinate cognate the readability scorer already credits -- coffee,
#     chocolate, soup, salad, sandwich, fruit. So one authored pattern plus a
#     free filler class is a dozen sentences the learner can say and nobody
#     had to write.
#   * `I am hungry` is here to pre-empt an error, not just to name a feeling.
#     Spanish uses *tener* for states English expresses with *be*, so `tengo
#     hambre` becomes *"I have hunger" -- one L1 rule producing a whole family
#     of mistakes. `have_state_for_be` in lib/content/error-patterns.ts catches
#     it, and this is the unit that makes it reachable.
#   * Miguel orders without Carlos, without Ana, and without being rescued when
#     he hesitates. Maria waits. That is the scene.

unit_id: b1_u6
block: 1
order: 6
title_es: "Lo que quiero"
title_en: "What I want"
cefr: A0
can_do_es: "Puedo pedir lo que quiero y decir si tengo hambre o sed"
target_contrast: ee_ih

