speaking_task:
  mode: scripted
  character: maria
  scenario_es: "Estás en un café y quieres pedir algo. Pídelo tú, sin ayuda."
  scenario_en: "You are in a café and you want to order. Ask for it yourself."
  target_chunks: [c_0128, c_0133, c_0137, c_0142, c_0143, c_0149]
  script:
    - speaker: ai
      en: "Good morning! What do you want?"
      es: "¡Buenos días! ¿Qué quieres?"
