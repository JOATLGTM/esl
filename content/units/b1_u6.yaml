          - "That he paid Maria"
        answer: 1

  - id: s_0036
    title_es: "¿Qué quieres?"
    character: maria
    duration_target_s: 48
    transcript: |
      MARIA: Miguel, good morning! A small coffee with milk?
      MIGUEL: Yes, please. And some bread.
      MARIA: Some bread. Okay.
      MIGUEL: Maria, do you have fruit?
      MARIA: Fruit? Yes, I have fruit.
      MIGUEL: I would like some fruit, please. It is for Ana.
      MARIA: For Ana! Okay.
      MIGUEL: Maria, are you hungry? Do you want some bread?
      MARIA: Me? Thank you, Miguel! A little, please.
      MIGUEL: Some bread for Maria, and it is for you.
      MARIA: Thank you! You are here every morning, and you want a small coffee with milk.
      MIGUEL: Every morning! I like it.
      MARIA: See you tomorrow, Miguel.
      MIGUEL: See you tomorrow, Maria.
