# Block 1, Unit 3 -- family, people, and the first true thing Miguel says.
#
# The beat (content/STORY.md): Ana asks who is in the photo. He answers, and
# then he says he misses them. Units 1 and 2 were transactions -- a greeting
# returned, a form survived. This is the first time Miguel tells someone
# something about himself that costs him anything to say.
#
# Design notes for whoever edits this next:
#   * `I miss them` is the unit. Everything else is scaffolding to make that
#     sentence sayable, and the frame f_0005 exists so it generalises rather
#     than being one memorised string.
#   * The third-person pronouns land here (he/she/they/him/her/them/his/their).
#     Nothing before this unit could talk ABOUT a person, only TO one, which is
#     why every earlier scene is two people facing each other.
#   * Carlos gets his counterweight here. He has been the shortcut Miguel keeps
#     refusing; in s_0016 he says his own family is here and he does not go
#     back. He is not an obstacle, he is ten years ahead.

unit_id: b1_u3
block: 1
order: 3
title_es: "Mi familia"
title_en: "My family"
cefr: A0
can_do_es: "Puedo hablar de mi familia y decir a quién extraño"
target_contrast: ee_ih

