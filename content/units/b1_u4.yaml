# Both frames take place nouns, which are cognates rather than taught chunks --
# so the fillers are literal, and the readability scorer is what licenses them.
frames:
  - id: f_0007
    pattern: "Where is the {NP}?"
    es_pattern: "¿Dónde está el {NP}?"
    slot: NP
    literal_fillers: ["café", "store", "park", "bank", "market", "hospital", "restaurant", "building"]
    cefr: A0
    tags: [question, places]

  - id: f_0008
    pattern: "It is next to the {NP}."
    es_pattern: "Está al lado del {NP}."
    slot: NP
    literal_fillers: ["café", "store", "park", "bank", "market", "hospital"]
    cefr: A0
    tags: [places]

scenes:
  # One afternoon: Miguel sets out, gets lost, is pointed, arrives -- and then
  # points someone else. The last scene is the whole unit's argument.

  - id: s_0019
    title_es: "¿Dónde está el café?"
    character: ana
    duration_target_s: 44
    transcript: |
      MIGUEL: Ana, good morning.
      ANA: Good morning, Miguel. How are you?
      MIGUEL: I am fine, thank you. Ana, where is the café?
      ANA: The café? It is near here. It is not far.
      MIGUEL: Is it far?
      ANA: No, it is near. Go down this street.
      MIGUEL: Go down this street. Okay.
      ANA: And turn right at the store.
      MIGUEL: Turn right at the store.
      ANA: Yes! It is on the corner.
      MIGUEL: It is on the corner. Thank you, Ana.
      ANA: See you later, Miguel!
    questions:
      - q_es: "¿Qué hace Miguel después de cada indicación?"
        options_es:
          - "La repite"
          - "Pregunta otra cosa"
          - "No dice nada"
        answer: 0
      - q_es: "¿El café está lejos?"
        options_es:
          - "Sí, muy lejos"
          - "No, está cerca"
          - "Ana no lo sabe"
        answer: 1
      - q_es: "¿Dónde tiene que dar vuelta Miguel?"
        options_es:
          - "En el parque"
          - "En la esquina"
          - "En la tienda"
        answer: 2

  - id: s_0020
    title_es: "Estoy perdido"
    character: tom
    duration_target_s: 44
    transcript: |
      MIGUEL: Excuse me... Tom?
      TOM: Miguel! Hello. How are you?
      MIGUEL: Tom, I am lost.
      TOM: You are lost? Okay. Where do you go?
      MIGUEL: The café. Where is the café?
      TOM: The café. It is not on this street.
      MIGUEL: It is not on this street?
      TOM: No. Go up this street to the corner.
      MIGUEL: Excuse me, can you repeat that?
      TOM: Go up this street. To the corner.
      MIGUEL: Go up this street, to the corner. Okay.
      TOM: And it is across from the park.
    questions:
      - q_es: "¿Qué hizo mal Miguel antes de esta escena?"
        options_es:
          - "Fue por la calle equivocada"
          - "Olvidó el nombre del café"
          - "Llegó tarde"
        answer: 0
      - q_es: "¿Qué hace Miguel cuando no alcanza a entender?"
        options_es:
          - "Se va"
          - "Pide que se lo repitan"
          - "Dice que sí sin entender"
        answer: 1
      - q_es: "¿Cómo reacciona Tom al ver que Miguel está perdido?"
        options_es:
          - "Se ríe de él"
          - "Le dice que no puede ayudarlo"
          - "Le da las indicaciones sin más"
        answer: 2

  - id: s_0021
    title_es: "Otra vez, por favor"
    character: tom
    duration_target_s: 46
    transcript: |
      MIGUEL: Across from the park?
      TOM: Yes. The park is on this street. Go up, and it is across from the park.
      MIGUEL: One moment, please. Can you repeat the street?
      TOM: This street. Go up this street.
      MIGUEL: This street. Up. And the park?
      TOM: The park is near the bank. It is one block from here.
      MIGUEL: One block. Okay.
      TOM: And the café is across from the park.
      MIGUEL: The café is across from the park.
      TOM: Yes! Miguel, you understand.
      MIGUEL: Thank you, I understand.
    questions:
      - q_es: "¿Cuántas veces pide Miguel que le repitan algo?"
        options_es:
          - "Ninguna"
          - "Una"
          - "Dos"
        answer: 2
      - q_es: "¿Qué está cerca del parque?"
        options_es:
          - "El banco"
          - "La casa de Tom"
          - "La parada del autobús"
        answer: 0
      - q_es: "¿Por qué Tom le dice \"you understand\"?"
        options_es:
          - "Porque Miguel se va sin decir nada"
          - "Porque Miguel repitió bien las indicaciones"
          - "Porque Miguel habla como Tom"
        answer: 1

  - id: s_0022
    title_es: "En el café, por fin"
    character: maria
    duration_target_s: 44
    transcript: |
      MARIA: Miguel! Good afternoon!
      MIGUEL: Good afternoon, Maria.
      MARIA: How are you?
      MIGUEL: I am fine, thank you. I am here!
      MARIA: Yes, you are here. Is it far, your house?
      MIGUEL: It is far. But I am here.
      MARIA: Miguel, the store is closed.
      MIGUEL: The store is closed?
      MARIA: Yes. But the café is open. The café is open in the afternoon.
      MIGUEL: The café is open. Okay!
      MARIA: Come in, Miguel.
    questions:
      - q_es: "¿Cómo llega Miguel al café?"
        options_es:
          - "Alguien lo trae"
          - "Llega él solo, después de perderse"
          - "No llega"
        answer: 1
      - q_es: "¿Qué está cerrado?"
        options_es:
          - "La tienda"
          - "El café"
          - "El banco"
        answer: 0
      - q_es: "¿Por qué dice Miguel \"but I am here\"?"
        options_es:
          - "Porque el café está cerca"
          - "Porque Maria no lo esperaba"
          - "Porque llegó aunque le costó"
        answer: 2

  - id: s_0023
    title_es: "¿Dónde trabajas?"
    character: carlos
    duration_target_s: 44
    transcript: |
      CARLOS: Miguel! You are here.
      MIGUEL: Hello, Carlos. Yes, I am here.
      CARLOS: Miguel, where is your house?
      MIGUEL: It is far. It is that building, near the park.
      CARLOS: Near the park! I work near the park.
      MIGUEL: Where do you work, Carlos?
      CARLOS: I work in that building, on the corner.
      MIGUEL: On the corner of this street?
      CARLOS: Yes. It is one block from here.
      MIGUEL: One block. It is near.
      CARLOS: It is near. We are next to the park, you and me.
    questions:
      - q_es: "¿Qué descubren Carlos y Miguel?"
        options_es:
          - "Que trabajan juntos"
          - "Que viven en la misma casa"
          - "Que están cerca el uno del otro"
        answer: 2
      - q_es: "¿Dónde trabaja Carlos?"
        options_es:
          - "En un edificio en la esquina"
          - "En el café"
          - "En la tienda"
        answer: 0
      - q_es: "¿Quién pregunta primero por el trabajo del otro?"
        options_es:
          - "Carlos"
          - "Miguel"
          - "Nadie pregunta"
        answer: 1

  - id: s_0024
    title_es: "Carlos está perdido"
    character: carlos
    duration_target_s: 46
    transcript: |
      CARLOS: Miguel, where is the bus stop?
      MIGUEL: The bus stop?
      CARLOS: Yes. I do not understand this street.
      MIGUEL: One moment. Go down this street, to the corner.
      CARLOS: Go down this street.
      MIGUEL: Yes. And turn left at the store.
      CARLOS: Turn left at the store. Is it far?
      MIGUEL: No, it is near here. It is one block.
      CARLOS: One block. Okay!
      MIGUEL: It is across from the market. Come with me.
      CARLOS: Thank you, Miguel!
      MIGUEL: You are welcome, Carlos.
    questions:
      - q_es: "¿Qué cambió entre la primera escena y esta?"
        options_es:
          - "Ahora Miguel da las indicaciones"
          - "Ahora Miguel está perdido otra vez"
          - "Ahora Carlos habla español"
        answer: 0
      - q_es: "¿Qué le ofrece Miguel a Carlos al final?"
        options_es:
          - "Su teléfono"
          - "Acompañarlo"
          - "Un café"
        answer: 1
      - q_es: "¿Miguel duda al dar las indicaciones?"
        options_es:
          - "Sí, no sabe la calle"
          - "Sí, se equivoca dos veces"
          - "No, solo pide un momento y sigue"
        answer: 2

speaking_task:
  mode: scripted
  character: tom
  scenario_es: "Estás perdido en la calle. Pide ayuda y entiende la respuesta."
  scenario_en: "You are lost on the street. Ask for help and understand the answer."
  target_chunks: [c_0078, c_0079, c_0080, c_0082, c_0085, c_0102]
  script:
    - speaker: ai
      en: "Hello! Are you okay?"
      es: "¡Hola! ¿Estás bien?"
    - speaker: user
      en: "Excuse me. I am lost."
      es: "Disculpe. Estoy perdido."
    - speaker: ai
      en: "Okay. Where do you go?"
      es: "Está bien. ¿A dónde vas?"
    - speaker: user
      en: "Where is the café?"
      es: "¿Dónde está el café?"
    - speaker: ai
      en: "Go straight, and turn right at the store."
      es: "Sigue derecho, y da vuelta a la derecha en la tienda."
    - speaker: user
      en: "Go straight, and turn right. Is it far?"
      es: "Sigo derecho, y doy vuelta a la derecha. ¿Está lejos?"
    - speaker: ai
      en: "No, it is near here. It is one block."
      es: "No, está cerca de aquí. Está a una cuadra."
    - speaker: user
      en: "Thank you, I understand."
      es: "Gracias, entiendo."

missions:
  - id: m_0007
    title_es: "Pregunta dónde está algo"
    instructions_es: >-
      Pregúntale a alguien en inglés dónde está un lugar: "Where is the bank?".
      No importa si ya sabes dónde está. Lo que se practica es preguntar.
    prep_chunk_ids: [c_0078, c_0092]
    difficulty: 2
    alternate_es: >-
      Búscalo en un mapa del teléfono y di la pregunta en voz alta antes de
      buscar. Preguntar en voz alta es la parte que cuesta.

  - id: m_0008
    title_es: "Di que estás perdido"
    instructions_es: >-
      Di "I am lost" en voz alta a alguien. Es la frase que convierte estar
      perdido en una conversación, y por eso vale la pena tenerla lista antes
      de necesitarla.
    prep_chunk_ids: [c_0079]
    difficulty: 2
    alternate_es: >-
      Dilo en voz alta tres veces, hoy, antes de salir. Que salga sin pensarlo
      es justo lo que hace falta el día que pase de verdad.
