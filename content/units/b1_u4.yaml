# Block 1, Unit 4 -- places, and getting somewhere on your own.
#
# The beat (content/STORY.md): Miguel gets lost on the way to the cafe.
# Someone points. He arrives. And in the last scene he gives directions to
# Carlos -- the man who has spent three units offering to translate for him.
#
# Design notes for whoever edits this next:
#   * The place nouns are almost all Latinate cognates (cafe, park, bank,
#     market, hospital, restaurant) and are deliberately NOT in
#     vocab-schedule.yaml. The readability scorer credits them already, and
#     this is the one unit in Block 1 where the cognate windfall pays -- which
#     is why a unit about places can afford to spend its whole vocabulary
#     budget on prepositions and verbs of motion instead.
#   * `I am lost` is the phrase the unit exists to give someone. It is a repair
#     strategy dressed as a location: a learner who can say it converts being
#     stranded into a conversation.
#   * Miguel asks Tom to repeat, twice, and then says the directions back.
#     Repeating instructions to confirm them is a real strategy and nobody
#     teaches it; it is also the only way an A0 learner survives directions.

