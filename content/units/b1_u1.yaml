# Block 1, Unit 1 -- the very first thing a learner at zero ever sees.
#
# Design notes for whoever edits this next:
#   * Every chunk is something Miguel could say out loud today and be understood.
#     No isolated vocabulary, no "the cat is on the table".
#   * Four chunks are repair strategies (I'm sorry / I don't understand / can you
#     repeat that / how do you say that). They are here in unit ONE on purpose:
#     PRD 3 defines fluency as including the ability to repair, and a learner who
#     can stall a conversation instead of freezing will not quit in week two.
#   * The scenes reuse the same 40-odd words relentlessly. That is the 95% rule
#     doing its job, not a lack of imagination.

unit_id: b1_u1
block: 1
order: 1
title_es: "Hola"
title_en: "Hello"
cefr: A0
can_do_es: "Puedo saludar, decir mi nombre y pedir ayuda cuando no entiendo"
target_contrast: ee_ih

