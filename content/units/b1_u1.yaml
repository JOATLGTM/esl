  - id: c_0022
    en: "Can you repeat that?"
    es: "¿Puede repetirlo?"
    cefr: A0
    example_en: "Excuse me. Can you repeat that, please?"
    example_es: "Disculpe. ¿Puede repetirlo, por favor?"
    tags: [repair, question, core]
    audio: [auto]

  - id: c_0023
    en: "How do you say that?"
    es: "¿Cómo se dice eso?"
    cefr: A0
    example_en: "Excuse me. How do you say that?"
    example_es: "Disculpe. ¿Cómo se dice eso?"
    tags: [repair, question, core]
    audio: [auto]

  - id: c_0024
    en: "I'm from"
    es: "Soy de"
    cefr: A0
    example_en: "Hello. I'm from Mexico."
    example_es: "Hola. Soy de México."
    tags: [introduction, origin]
    audio: [auto]

  - id: c_0025
    en: "This is"
    es: "Este es / Esta es"
    cefr: A0
    example_en: "Ana, this is Miguel."
    example_es: "Ana, este es Miguel."
    tags: [introduction, presenting]
    audio: [auto]

# Three patterns that were already here, wearing a chunk's clothes.
#
# `My name is`, `I'm from` and `This is` are not sentences -- each has a hole,
# and until frames existed the hole was left implicit and the learner was shown
# a fragment. The chunks stay (they carry the audio, and the card that
# introduces the phrase is still the right card); these say what goes after.
#
# All fillers are literal, because names and countries are things the
# curriculum will never teach as chunks. They pass the 95% rule as proper
# nouns, which is exactly what that credit is for.
frames:
  - id: f_0001
    pattern: "My name is {NAME}."
    es_pattern: "Me llamo {NAME}."
    slot: NAME
    literal_fillers: ["Ana", "Miguel", "Maria", "Carlos", "Rosa", "Tom", "Sofia", "Elena"]
    cefr: A0
    tags: [introductions]

  - id: f_0002
    pattern: "I'm from {PLACE}."
    es_pattern: "Soy de {PLACE}."
    slot: PLACE
    literal_fillers: ["Mexico", "Guatemala", "Honduras", "Colombia", "Peru", "Ecuador", "Venezuela", "Bolivia"]
    filler_images:
      "Mexico": /images/flag-mexico.svg
      "Guatemala": /images/flag-guatemala.svg
      "Honduras": /images/flag-honduras.svg
      "Colombia": /images/flag-colombia.svg
      "Peru": /images/flag-peru.svg
      "Ecuador": /images/flag-ecuador.svg
      "Venezuela": /images/flag-venezuela.svg
      "Bolivia": /images/flag-bolivia.svg
    cefr: A0
    tags: [introductions]

  - id: f_0003
    pattern: "This is {NAME}."
    es_pattern: "Este es {NAME}."
    slot: NAME
    literal_fillers: ["Ana", "Miguel", "Maria", "Carlos", "Rosa", "Tom", "Sofia", "Elena"]
    cefr: A0
    tags: [introductions]

scenes:
  # Scenes are long on repetition by design. At A0 the same six chunks recurring
  # in shifting combinations is the lesson; novelty would just break the 95% rule.
  #
  # Every speaker tag is a cast member from content/characters.yaml, and the six
  # scenes are one continuous afternoon rather than six unrelated encounters
  # (PRD 4.3). Miguel is new here, so he is the one who does not understand --
  # which is what puts the repair chunks in a real mouth instead of a drill.

  - id: s_0001
    title_es: "Miguel conoce a su vecina"
    character: ana
    duration_target_s: 40
    transcript: |
      ANA: Hello.
      MIGUEL: Hello.
      ANA: My name is Ana. What's your name?
      MIGUEL: My name is Miguel.
      ANA: Nice to meet you, Miguel.
      MIGUEL: Nice to meet you, Ana.
      ANA: How are you?
      MIGUEL: I'm fine, thank you. And you?
      ANA: I'm fine, thank you.
      ANA: Miguel, this is Carlos.
      MIGUEL: Hello, Carlos. Nice to meet you.
      CARLOS: Nice to meet you, Miguel. How are you?
      MIGUEL: I'm fine, thank you.
      ANA: Goodbye, Miguel. See you later.
      MIGUEL: Goodbye, Ana. Goodbye, Carlos.
      CARLOS: Goodbye.
    questions:
      - q_es: "¿Quién presenta a Carlos?"
        options_es: ["Miguel", "Ana", "Carlos mismo"]
        q_en: "Who introduces Carlos?"
        options_en:
          - "Miguel"
          - "Ana"
          - "Carlos himself"
        answer: 1
      - q_es: "Cuando Ana pregunta «How are you?», ¿qué contesta Miguel?"
        options_es: ["Que no entiende", "Que está bien", "Que ya se va"]
        q_en: "When Ana asks \"How are you?\", what does Miguel answer?"
        options_en:
          - "That he does not understand"
          - "That he is fine"
          - "That he is leaving"
        answer: 1
      - q_es: "¿Quiénes se despiden al final?"
        options_es: ["Solo Ana", "Solo Miguel", "Los tres"]
        q_en: "Who says goodbye at the end?"
        options_en:
          - "Only Ana"
          - "Only Miguel"
          - "All three"
        answer: 2

  - id: s_0002
    title_es: "Buenos días en el café"
    character: maria
    duration_target_s: 45
    transcript: |
      MARIA: Good morning.
      MIGUEL: Good morning. How are you?
      MARIA: I'm fine, thank you. And you?
      MIGUEL: I'm fine, thank you.
      MIGUEL: Excuse me. What's your name?
      MARIA: My name is Maria. And you?
      MIGUEL: My name is Miguel.
      MARIA: Nice to meet you, Miguel.
      MIGUEL: Nice to meet you, Maria.
      MIGUEL: I'm from Mexico. And you?
      MARIA: I'm from Texas.
      MARIA: Miguel, this is Rosa.
      ROSA: Hello, Miguel. Nice to meet you.
      MIGUEL: Nice to meet you, Rosa.
      ROSA: Good morning, Maria.
      MARIA: Good morning, Rosa. Goodbye, Miguel. See you later.
      MIGUEL: Goodbye.
    questions:
      - q_es: "¿De dónde es María?"
        options_es: ["De México", "De Texas", "De España"]
        q_en: "Where is Maria from?"
        options_en:
          - "Mexico"
          - "Texas"
          - "Spain"
        answer: 1
      - q_es: "¿Qué hace Miguel antes de preguntarle el nombre?"
        options_es: ["Le da las gracias", "Se disculpa para llamar su atención", "Se despide"]
        q_en: "What does Miguel do before asking her name?"
        options_en:
          - "Thanks her"
          - "Says \"excuse me\" to get her attention"
          - "Says goodbye"
        answer: 1
      - q_es: "¿Quién llega después y saluda a Miguel?"
        options_es: ["Carlos", "Tom", "Rosa"]
        q_en: "Who arrives later and greets Miguel?"
        options_en:
          - "Carlos"
          - "Tom"
          - "Rosa"
        answer: 2

  - id: s_0003
    title_es: "No entiendo"
    character: miguel
    duration_target_s: 50
    # Tom is British, and this is the first scene where that matters: Miguel
    # misses the line twice before he gets it. Asking for a repeat is the win
    # condition here, not a failure state (PRD X15).
    transcript: |
      TOM: Hello. What's your name?
      MIGUEL: I'm sorry. I don't understand.
      TOM: What's your name?
      MIGUEL: Can you repeat that, please?
      TOM: What is your name?
      MIGUEL: My name is Miguel.
      TOM: Nice to meet you, Miguel. My name is Tom.
      MIGUEL: I'm sorry. Can you repeat that, please?
      TOM: Tom. My name is Tom.
      MIGUEL: Nice to meet you, Tom.
      TOM: How are you, Miguel?
      MIGUEL: I'm sorry, I don't understand. How do you say that?
      TOM: How are you?
      MIGUEL: I'm fine, thank you. And you?
      TOM: I'm fine. Thank you, Miguel.
      MIGUEL: You're welcome. Goodbye, Tom.
      TOM: Goodbye. See you later.
    questions:
      - q_es: "¿Cuántas veces le pide Miguel a Tom que repita?"
        options_es: ["Una", "Dos", "Ninguna"]
        q_en: "How many times does Miguel ask Tom to repeat?"
        options_en:
          - "Once"
          - "Twice"
          - "Never"
        answer: 1
      - q_es: "¿Por qué Tom dice su nombre otra vez?"
        options_es: ["Porque se equivocó de nombre", "Porque Miguel no lo entendió", "Porque Miguel se lo preguntó dos veces"]
        q_en: "Why does Tom say his name again?"
        options_en:
          - "He got the name wrong"
          - "Miguel did not understand it"
          - "Miguel asked twice"
        answer: 1
      - q_es: "Miguel dice «You're welcome». ¿Por qué?"
        options_es: ["Porque se está despidiendo", "Porque Tom le dio las gracias", "Porque no entendió"]
        q_en: "Miguel says \"You're welcome\". Why?"
        options_en:
          - "He is saying goodbye"
          - "Tom thanked him"
          - "He did not understand"
        answer: 1

  - id: s_0004
    title_es: "Carlos presenta a Ana"
    character: carlos
    duration_target_s: 50
    transcript: |
      CARLOS: Hi. My name is Carlos.
      ROSA: Hi Carlos. My name is Rosa.
      CARLOS: Nice to meet you, Rosa. How are you?
      ROSA: I'm fine, thank you. And you?
      CARLOS: I'm fine.
      ROSA: Carlos, I'm from Peru. And you?
      CARLOS: I'm from Colombia.
      ROSA: Nice.
      CARLOS: Rosa, this is Ana. Ana is from Mexico.
      ANA: Hello, Rosa. Nice to meet you.
      ROSA: Nice to meet you, Ana.
      ANA: How are you?
      ROSA: I'm fine, thank you. And you?
      ANA: I'm fine, thank you.
      CARLOS: Good night, Rosa. Good night, Ana.
      ROSA: Good night, Carlos. See you later.
      ANA: Goodbye.
    questions:
      - q_es: "¿De dónde es Rosa?"
        options_es: ["De Colombia", "De México", "De Perú"]
        q_en: "Where is Rosa from?"
        options_en:
          - "Colombia"
          - "Mexico"
          - "Peru"
        answer: 2
      - q_es: "¿Quién presenta a Ana?"
        options_es: ["Rosa", "Carlos", "Ana se presenta sola"]
        q_en: "Who introduces Ana?"
        options_en:
          - "Rosa"
          - "Carlos"
          - "Ana introduces herself"
        answer: 1
      - q_es: "¿En qué momento del día se despiden?"
        options_es: ["En la mañana", "En la noche", "En la tarde"]
        q_en: "What time of day do they say goodbye?"
        options_en:
          - "In the morning"
          - "At night"
          - "In the afternoon"
        answer: 1

  - id: s_0005
    title_es: "Gracias y de nada"
    character: maria
    duration_target_s: 45
    transcript: |
      MIGUEL: Excuse me.
      MARIA: Yes?
      MIGUEL: What's your name?
      MARIA: My name is Maria.
      MIGUEL: I'm sorry. Can you repeat that, please?
      MARIA: Maria. My name is Maria.
      MIGUEL: Thank you, Maria. My name is Miguel.
      MARIA: Nice to meet you, Miguel.
      MIGUEL: Nice to meet you.
      MARIA: How are you, Miguel?
      MIGUEL: I'm fine, thank you. And you?
      MARIA: I'm fine, thank you.
      MIGUEL: Maria, I'm from Mexico. And you?
      MARIA: I'm from Texas.
      MIGUEL: Thank you, Maria.
      MARIA: You're welcome. Goodbye, Miguel. See you later.
      MIGUEL: Goodbye, Maria.
    questions:
      - q_es: "¿Qué hace Miguel cuando no entiende el nombre de María?"
        options_es: ["Se va", "Le pide que lo repita", "Cambia de tema"]
        q_en: "What does Miguel do when he does not understand Maria's name?"
        options_en:
          - "He leaves"
          - "He asks her to repeat it"
          - "He changes the subject"
        answer: 1
      - q_es: "¿Quién dice «You're welcome»?"
        options_es: ["Miguel", "María", "Los dos"]
        q_en: "Who says \"You're welcome\"?"
        options_en:
          - "Miguel"
          - "Maria"
          - "Both"
        answer: 1
      - q_es: "¿Cuántas veces le da las gracias Miguel a María?"
        options_es: ["Una", "Dos", "Ninguna"]
        q_en: "How many times does Miguel thank Maria?"
        options_en:
          - "Once"
          - "Twice"
          - "Never"
        answer: 1

  - id: s_0006
    title_es: "Buenas tardes, buenas noches"
    character: rosa
    duration_target_s: 50
    # The repair goes the other way round here: Tom is the native speaker and he
    # is the one who asks Miguel to repeat. Nobody in this world is bad at this.
    transcript: |
      ROSA: Good afternoon, Miguel.
      MIGUEL: Good afternoon, Rosa. How are you?
      ROSA: I'm fine, thank you. And you?
      MIGUEL: I'm fine, thank you.
      ROSA: Miguel, this is Tom. Tom is from England.
      MIGUEL: Hello, Tom. Nice to meet you.
      TOM: Nice to meet you, Miguel. How are you?
      MIGUEL: I'm fine, thank you. And you?
      TOM: I'm fine.
      MIGUEL: Tom, I'm from Mexico.
      TOM: I'm sorry. Can you repeat that, please?
      MIGUEL: Mexico. I'm from Mexico.
      TOM: Nice. Thank you.
      ROSA: Good night, Miguel. Good night, Tom.
      MIGUEL: Good night, Rosa. See you later.
      TOM: Good night. Goodbye.
    questions:
      - q_es: "¿De dónde es Tom?"
        options_es: ["De México", "De Inglaterra", "De Estados Unidos"]
        q_en: "Where is Tom from?"
        options_en:
          - "Mexico"
          - "England"
          - "The United States"
        answer: 1
      - q_es: "¿Qué pasa cuando Miguel dice de dónde es?"
        options_es: ["Tom no entiende y le pide que repita", "Rosa lo corrige", "Nadie le contesta"]
        q_en: "What happens when Miguel says where he is from?"
        options_en:
          - "Tom does not understand and asks him to repeat"
          - "Rosa corrects him"
          - "Nobody answers"
        answer: 0
      - q_es: "La conversación empieza por la tarde. ¿Cómo termina?"
        options_es: ["Por la mañana", "Ya de noche", "Sigue siendo de tarde"]
        q_en: "The conversation starts in the afternoon. How does it end?"
        options_en:
          - "In the morning"
          - "At night"
          - "Still in the afternoon"
        answer: 1

speaking_task:
  mode: scripted
  character: ana
  scenario_es: "Conoces a alguien nuevo. Salúdala, di tu nombre y pregunta el suyo."
  scenario_en: "You meet someone new. Greet them, say your name, and ask theirs."
  target_chunks: [c_0001, c_0008, c_0009, c_0010, c_0011, c_0012]
  # Scripted mode (PRD 4.5): the exact line is on screen. Success is saying it
  # out loud, nothing more. `{name}` is substituted with the learner's name.
  script:
    - speaker: ai
      en: "Hello! My name is Ana. What's your name?"
      es: "¡Hola! Me llamo Ana. ¿Cómo te llamas?"
    - speaker: user
      en: "Hello. My name is {name}."
      es: "Hola. Me llamo {name}."
    - speaker: ai
      en: "Nice to meet you, {name}. How are you?"
      es: "Mucho gusto, {name}. ¿Cómo estás?"
    - speaker: user
      en: "I'm fine, thank you. And you?"
      es: "Estoy bien, gracias. ¿Y tú?"
    - speaker: ai
      en: "I'm fine, thank you. Goodbye, {name}!"
      es: "Estoy bien, gracias. ¡Adiós, {name}!"
    - speaker: user
      en: "Goodbye. See you later."
      es: "Adiós. Hasta luego."

# Real-world missions (PRD F12).
#
# The point is not the English. It is that the learner opens their mouth in
# front of a stranger and survives it -- which is the single thing that decides
# whether someone becomes a speaker or stays a studier. Difficulty 1 for the
# first unit means one word, to one person, with no reply required.
#
# `alternate_es` is mandatory on every mission. A learner in a town with no
# English speakers is exactly who this course is for, and a mission they cannot
# attempt is a mission that tells them the product was not built for them.
#
# A mission is never failed. Attempting is the behaviour being rewarded, and the
# report exists to be listened to, never to gate anything.
missions:
  - id: m_0001
    title_es: "Saluda a una persona"
    instructions_es: >-
      Hoy, dile «Hello» a una persona: en la tienda, en el trabajo, en el
      elevador. Una palabra. No tienes que entender lo que te responda.
    prep_chunk_ids: [c_0001, c_0002]
    difficulty: 1
    alternate_es: >-
      Si hoy no ves a nadie que hable inglés, dilo en voz alta frente al espejo
      o grábate un audio. Cuenta igual.

  - id: m_0002
    title_es: "Di tu nombre"
    instructions_es: >-
      Preséntate con alguien en inglés: «Hello, my name is ...». Si te preguntan
      algo más y no entiendes, di «Sorry, I don't understand». Eso también es
      hablar inglés.
    prep_chunk_ids: [c_0001, c_0009, c_0010]
    difficulty: 2
    alternate_es: >-
      Mándale un audio a alguien de confianza presentándote en inglés, o dilo
      frente al espejo. Lo que importa es que salga de tu boca.
