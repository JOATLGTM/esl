# The A0 -> A2 spine.
#
# Four blocks, 24 units. This used to be six blocks and 36 units ending at B1,
# and the change is deliberate -- see docs/CONTENT-BRIEF.md. In short: 36 units
# is roughly 120-150 learner-hours, A0->B1 is conventionally 350-400, and no
# amount of content sourcing closes a gap that large. The old spine promised a
# B1 it could not reach. This one promises an A2 it can.
#
# A2 is not a consolation prize for this learner. It is understanding a
# supervisor, handling a transaction, making a phone call, and talking to a
# neighbour -- which is the whole reason the product exists. Blocks 5-6 (A2+,
# B1) are not cancelled, they are just not v1, and the hours they would have
# cost buy the frame layer and an extensive listening library instead.
#
# `units` lists only units that are authored and validated. Adding a unit id
# here without a matching content/units/<id>.yaml is a hard validation failure,
# so this file is always an honest picture of what exists.

blocks:
  - block: 1
    title_es: "Primeros Sonidos"
    cefr: A0
    chunk_target_cumulative: 150
    frame_target_cumulative: 8
    can_do_es: "Puedo presentarme y responder preguntas básicas"
    l1_support_level: 1
    units:
      - b1_u1
      # b1_u2 .. b1_u6 to come -- numbers, yes/no questions, family, places, time

  - block: 2
    title_es: "Mi Día"
    cefr: A1
    chunk_target_cumulative: 380
    frame_target_cumulative: 60
    can_do_es: "Puedo describir mi día y mi familia"
    l1_support_level: 1
    units: []

  - block: 3
    title_es: "En la Calle"
    cefr: A1+
    chunk_target_cumulative: 620
    frame_target_cumulative: 130
    can_do_es: "Puedo hacer una compra o pedir direcciones"
    l1_support_level: 2
    units: []

  - block: 4
    title_es: "Ayer y Mañana"
    cefr: A2
    chunk_target_cumulative: 850
    frame_target_cumulative: 200
    can_do_es: "Puedo contar qué pasó, qué voy a hacer, y resolver un problema"
    l1_support_level: 3
    units: []
