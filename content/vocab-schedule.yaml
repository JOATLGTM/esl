# The vocabulary release schedule.
#
# Which English words become legal in which unit. This is the file that turns
# the 95% rule from something an author *discovers* into something they
# *design against*.
#
# Without it, authoring a scene means writing it, running the validator, and
# fighting whatever comes back -- the constraint arrives after the work, as an
# adversary. With it, you open the unit you are writing, read the words that
# are legal by then, and write inside them. Validation becomes a formality.
#
# Rules:
#   - A word is released ONCE, in the earliest unit allowed to use it, and is
#     legal forever after. Releasing it twice is an error, because a duplicate
#     always means one of the two units was planned without reading the other.
#   - Inflections need no entry of their own: releasing `name` licenses
#     `names`, through the same morphological matching readability uses.
#   - Proper nouns are NOT here. `content/wordlists/proper-nouns.yaml` already
#     credits them and the course never teaches them as vocabulary.
#   - Cognates are NOT here either, for the same reason -- see
#     `content/wordlists/cognates.yaml`. A Spanish speaker reads `hospital` for
#     free, and paying authoring tax for it was never the plan.
#   - A unit may appear here before its content file exists. That is the point:
#     the schedule is a plan, and `npm run content:validate` checks the units
#     that do exist against it.
#
# Block 1 is planned in full. Its vocabulary is close to forced: the can-do
# statements in `curriculum.yaml` and the unit beats in `content/STORY.md`
# between them decide most of it, and what remains is ordering -- function
# words first, then the nouns each beat needs. Blocks 2-4 are NOT planned here
# yet; they want the frequency work in `docs/CONTENT-BRIEF.md`, and a word list
# that looked authoritative but was invented would be worse than none.
#
# Every word below was machine-checked before it was written: it tokenizes to
# itself, is not already released, is not an inflection of something released,
# and is not a cognate or proper noun the readability scorer credits anyway.

version: 1

units:
  - unit: b1_u1
    note: >-
      Greetings, names, courtesy, and the two repair phrases a beginner needs
      before anything else ("I don't understand", "Can you repeat that?").
      Measured from the authored unit rather than planned in advance -- this is
      the one unit that predates the schedule, so it defines the baseline the
      rest is planned against.
