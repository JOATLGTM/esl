# HVPT contrast #1 (PRD 4.4, priority 1): /iː/ vs /ɪ/.
#
# Spanish has five vowels; English has about twelve. This is the single
# highest-frequency confusion for a Spanish L1, and it is a *perception*
# problem before it is a production problem -- which is why this drill runs in
# Stage 1, before the learner is ever asked to say anything.
#
# High-variability phonetic training only works if the voice changes between
# items. The learner has to generalize across talkers instead of memorizing one
# talker; the drill scheduler enforces "no two consecutive items share a
# speaker" (PRD F3) and this file has to supply enough voices for that.
#
# THOSE VOICES ARE HUMAN (PRD 8.1B). Not TTS -- not even good TTS. The whole
# mechanism is acoustic variability between talkers, and neural voices have far
# less of it than real people do, so a synthetic set produces a drill that looks
# right in the UI and teaches much less than it appears to. `speakers` lists ids
# from content/speakers.yaml; the recordings live at
#   content/recordings/ee_ih/<speaker_id>/<word>.wav
# and until they exist this set is authored, not publishable, and the validator
# will keep saying so.
#
# Framing (brand-critical, PRD 4.4): the goal is being understood, never losing
# an accent. Nothing in `explain_es` may suggest an accent is a defect.

contrast: ee_ih
title_es: "Vocales largas y cortas"
explain_es: >-
  En español hay una sola "i". En inglés hay dos: una larga y tensa (sheep) y
  una corta y relajada (ship). Cambiar una por la otra cambia la palabra, así
  que vale la pena aprender a oír la diferencia. Primero el oído, después la
  boca.

# Six talkers, not the four PRD F3 requires. The recordings are free and talker
# variety IS the training mechanism, so there is no reason to be stingy.
speakers: [hs_01, hs_02, hs_03, hs_04, hs_05, hs_06]

pairs:
  - { id: mp_0001, word_a: sheep, word_b: ship,  ipa_a: "ʃiːp",  ipa_b: "ʃɪp" }
  - { id: mp_0002, word_a: seat,  word_b: sit,   ipa_a: "siːt",  ipa_b: "sɪt" }
