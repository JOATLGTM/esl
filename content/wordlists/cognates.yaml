# Spanish-English cognates (PRD F4).
#
# A cognate counts as a KNOWN token for A0-A2 readability gating. This is the
# structural advantage a Spanish L1 gives us and the PRD says to exploit it
# deliberately -- but only where recognition is genuinely free. Two guards:
#
#   1. `false_friends` overrides everything, including the suffix rules. These
#      are the words a Spanish speaker will confidently get WRONG, which is
#      worse than not knowing them.
#   2. Suffix rules only fire on words >= 5 letters, to avoid junk matches.
#
# Coverage note: ~290 curated entries here plus the suffix rules resolve most
# of the Oxford 3000 Latinate vocabulary. The PRD's ~1,500 figure counts the
# rule-derived words, not hand-authored rows.

version: 1

# --------------------------------------------------------------------------
# Productive suffix correspondences. English form on the left; if the English
# word ends this way and is long enough, a Spanish speaker reads through it.
# --------------------------------------------------------------------------
suffix_rules:
  - { en: "tion",  es: "ción",   note: "information / información" }
  - { en: "sion",  es: "sión",   note: "decision / decisión" }
  - { en: "ity",   es: "idad",   note: "university / universidad" }
  - { en: "ty",    es: "dad",    note: "difficulty / dificultad" }
  - { en: "ous",   es: "oso",    note: "famous / famoso" }
  - { en: "ment",  es: "mento",  note: "moment / momento" }
  - { en: "able",  es: "able",   note: "probable / probable" }
  - { en: "ible",  es: "ible",   note: "possible / posible" }
  - { en: "ance",  es: "ancia",  note: "importance / importancia" }
  - { en: "ence",  es: "encia",  note: "difference / diferencia" }
  - { en: "ist",   es: "ista",   note: "artist / artista" }
  - { en: "ism",   es: "ismo",   note: "tourism / turismo" }
  - { en: "ive",   es: "ivo",    note: "active / activo" }
  - { en: "ary",   es: "ario",   note: "necessary / necesario" }
  - { en: "ic",    es: "ico",    note: "public / público" }
  - { en: "al",    es: "al",     note: "natural / natural" }

# --------------------------------------------------------------------------
# False friends. NEVER counted as known. Each one is a documented trap; the
# `error_type: false_friend` deck in PRD F6 seeds from this list.
# --------------------------------------------------------------------------
false_friends:
  - { en: actually,     looks_like: actualmente,  really_means_es: "en realidad" }
  - { en: actual,       looks_like: actual,       really_means_es: "real, verdadero" }
  - { en: assist,       looks_like: asistir,      really_means_es: "ayudar" }
